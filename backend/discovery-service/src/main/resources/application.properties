server.port=${PORT:10100}
spring.application.name=discovery-service

eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:discovery-service}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:false}
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:10100/eureka/}
