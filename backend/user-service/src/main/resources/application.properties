server.port=${PORT:10108}
spring.config.import=optional:file:supabase.env[.properties],optional:file:.supabase.env[.properties],optional:file:backend/supabase.env[.properties],optional:file:../supabase.env[.properties]

spring.application.name=user-service

eureka.client.service-url.defaultZone=http://localhost:10100/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${USER_DB_URL:jdbc:h2:mem:userdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${USER_DB_USERNAME:sa}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.datasource.driver-class-name=${USER_DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:1}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${USER_DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
