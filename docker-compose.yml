services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  discovery-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: discovery-service
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery-service
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:10100/eureka/
    ports:
      - "10100:10100"

  auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: auth-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: auth-service
    depends_on:
      - discovery-service

  user-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: user-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: user-service
    depends_on:
      - discovery-service

  place-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: place-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: place-service
    depends_on:
      - discovery-service

  product-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: product-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: product-service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - discovery-service
      - kafka

  order-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: order-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: order-service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - discovery-service
      - kafka

  music-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: music-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: music-service
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:10101/music-service/api/music-votes/spotify/callback
      MUSIC_VOTE_PUBLIC_URL_TEMPLATE: http://localhost:3000/music-vote/%s
      MUSIC_VOTE_GATEWAY_BASE_URL: http://127.0.0.1:10101
    depends_on:
      - discovery-service

  gateway-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: gateway-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:10100/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: gateway-service
    ports:
      - "10101:10101"
    depends_on:
      - discovery-service
      - auth-service
      - user-service
      - place-service
      - product-service
      - order-service
      - music-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:10101
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
